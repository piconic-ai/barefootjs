# Assets-only Worker for the docs site's static files.
#
# Deployed from the same `dist/` as `wrangler.toml` (the HTML Worker), and
# routed at the static paths of the same hostname:
#   - barefootjs.dev/static/*   client JS chunks, CSS, icons, fonts
#   - barefootjs.dev/slides/*   the built slide decks (`/slides/*`)
# A route takes precedence over the HTML Worker's Custom Domain on the same
# hostname, and the most specific route pattern wins, so these paths never
# reach the HTML Worker. An assets-only Worker has no `main`, so a request
# to it never runs code and is free and unlimited — which is the point:
# the HTML Worker has Workers Cache on, and caching bills every request to
# a Worker, static assets included (see the note in wrangler.toml).
#
# The asset directory mirrors the URL path (dist/static/…, dist/slides/…),
# which is what a Worker with assets on a sub-path expects. `dist/_headers`
# applies here too. Files outside these paths are not served by this Worker.
#
# Deploy this BEFORE the HTML Worker (deploy.yml does), so a freshly
# deployed page never references chunks the static Worker does not have yet.
name = "barefootjs-site-static"
compatibility_date = "2024-01-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "barefootjs.dev/static/*", zone_name = "barefootjs.dev" },
  { pattern = "barefootjs.dev/slides/*", zone_name = "barefootjs.dev" },
]

[assets]
directory = "./dist"
