<!--
  Cover: full-bleed looping clip, kinetic title, one light sweep, then the stack rotator.
  assets/hero.mp4 + assets/hero.jpg (poster) are copied into dist/assets by build.sh and
  inlined by make-artifact.mjs. Swap the files to change the hero; nothing else references them.
  Source and license: assets/SOURCES.md
-->
<section class="peitho-slide layout-cover" data-slide-key="cover">
  <div class="hero" aria-hidden="true">
    <video class="hero-img" autoplay muted loop playsinline poster="assets/hero.jpg">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-shade"></div>
  </div>
  <div class="cover-inner">
    <h1><span class="slot-title">BarefootJS</span></h1>
    <div class="cover-rule" aria-hidden="true"></div>
    <div class="bf-mount cover-tagline" data-bf="Rotator"></div>
    <div class="cover-body slot-body-wrap">
      <div class="slot-body"><p>Signal-based TSX, compiled into the templates you already ship.</p>
</div>
    </div>
  </div>
</section>
