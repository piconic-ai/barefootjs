<!--
  Tetris swallows arrows / Space / Enter at the window capture phase while mounted,
  so from this slide only PageDown or a click moves on. narration.ts autoplay sends PageDown.
-->
<section class="peitho-slide layout-game" data-slide-key="play">
  <header class="head game-head">
    <div class="head-rule" aria-hidden="true"></div>
    <h1><span class="slot-title">It's just components.</span></h1>
    <div class="game-hint slot-body-wrap"><div class="slot-body"><p>← → move · ↑ rotate · ↓ soft drop · Space hard drop</p>
</div></div>
  </header>
  <div class="bf-mount game-mount" data-bf="Tetris"></div>
</section>
