name = "barefootjs-site"
main = "worker.ts"
compatibility_date = "2024-01-01"

# Workers Cache: Cloudflare consults the cache before running this Worker,
# so a hit never invokes it (no CPU time billed). What is cacheable, and for
# how long, is decided by the response headers the `cacheControl`
# middleware (site/shared/lib/cache-control.ts) sets on every HTML response.
# Requires Wrangler 4.69.0+.
#
# The catch this config is shaped around: with caching enabled, EVERY
# request to this Worker is billed at the standard request rate — including
# static asset requests that are otherwise free. So this Worker must not be
# the one serving the static assets. `wrangler.static.toml` deploys the
# same `dist/` as a separate, assets-only Worker (no cache, so its requests
# stay free) on routes for the static paths — `barefootjs.dev/static/*` and
# `barefootjs.dev/slides/*` — and a route takes precedence over this Worker's
# Custom Domain on the same hostname. Same origin, same URLs, no CORS.
#
# `[assets]` stays here for the few root-level files outside those routes
# (favicon, robots.txt, llms.txt …) and for `wrangler dev`.
[cache]
enabled = true

[assets]
directory = "./dist"
