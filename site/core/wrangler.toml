name = "barefootjs-site"
compatibility_date = "2024-01-01"

# barefootjs.dev is a static site: `bun run build` renders every page to
# dist/ (scripts/generate-static.tsx) and Workers Assets serves it. There is
# no `main` — no request runs Worker code, so every request is a static
# asset request, which is free and unlimited, and needs no Workers Cache.
#
# - html_handling (default "auto-trailing-slash"): /docs/quick-start serves
#   dist/docs/quick-start.html; a trailing slash redirects to the bare path.
# - dist/_redirects: the 301s for merged docs pages (from lib/navigation.ts).
# - dist/_headers: CORS for /static/components/* (the playground iframe).
# - dist/.assetsignore: build intermediates that are not uploaded.
[assets]
directory = "./dist"
