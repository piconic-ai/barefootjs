<!-- Ships: the What slide. The body is a list; each item becomes a tile (number, then label). -->
<section class="peitho-slide layout-ships">
  <header class="head">
    <div class="head-rule" aria-hidden="true"></div>
    <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
  </header>
  <div class="ships slot-body-wrap"><slot name="body" accepts="blocks" arity="1"></slot></div>
</section>
