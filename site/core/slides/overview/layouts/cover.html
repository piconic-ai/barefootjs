<!--
  Cover: full-bleed looping clip, the wordmark (no entrance animation), then the stack rotator.
  assets/hero.mp4 + assets/hero.jpg (poster) are copied verbatim into the output's assets/ by
  site/core/scripts/build-slides.ts. Swap the files to change the hero; nothing else references them.
  Source and license: assets/SOURCES.md
  `autoplay` keeps the clip playing without JS; component/narration.ts stops it and drops the
  sources when prefers-reduced-motion is set, so those viewers get the poster frame only.
-->
<section class="peitho-slide layout-cover">
  <div class="hero" aria-hidden="true">
    <video class="hero-img" autoplay muted loop playsinline poster="assets/hero.jpg">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-shade"></div>
  </div>
  <div class="cover-inner">
    <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
    <div class="cover-rule" aria-hidden="true"></div>
    <div class="bf-mount cover-tagline" data-bf="Rotator"></div>
    <div class="cover-body slot-body-wrap">
      <slot name="body" accepts="blocks" arity="0..*"></slot>
    </div>
  </div>
</section>
