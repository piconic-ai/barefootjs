<!--
  Cover: the wordmark (no entrance animation), then the stack rotator, on the paper ground.
  No hero media ships with the deck for now (see assets/SOURCES.md). To add one, drop
  assets/hero.mp4 + assets/hero.jpg in, record the license in SOURCES.md, and restore the
  <video> block inside .hero.
-->
<section class="peitho-slide layout-cover">
  <div class="hero" aria-hidden="true"></div>
  <div class="cover-inner">
    <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
    <div class="cover-rule" aria-hidden="true"></div>
    <div class="bf-mount cover-tagline" data-bf="Rotator"></div>
    <div class="cover-body slot-body-wrap">
      <slot name="body" accepts="blocks" arity="0..*"></slot>
    </div>
  </div>
</section>
