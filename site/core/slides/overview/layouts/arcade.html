<!--
  Full-bleed slide: the component IS the slide. Arcade swallows the arrow keys,
  Space and WASD at the window capture phase while mounted (see
  component/components/Arcade.tsx), so from this slide PageDown / PageUp /
  Escape or a click are what move on.
-->
<section class="peitho-slide layout-arcade">
  <div class="bf-mount arcade-mount" data-bf="Arcade"></div>
  <div class="arcade-caption">
    <h1 class="arcade-title"><slot name="title" accepts="inline" arity="1"></slot></h1>
    <div class="arcade-body slot-body-wrap"><slot name="body" accepts="blocks" arity="0..1"></slot></div>
  </div>
</section>
