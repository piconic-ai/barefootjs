<!-- Split: prose on the left, one terminal panel on the right. -->
<section class="peitho-slide layout-split">
  <header class="head">
    <div class="head-rule" aria-hidden="true"></div>
    <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
  </header>
  <div class="split-columns">
    <div class="split-body slot-body-wrap"><slot name="body" accepts="blocks" arity="0..*"></slot></div>
    <figure class="code split-code"><slot name="code" accepts="code" arity="1"></slot></figure>
  </div>
</section>
