<section class="peitho-slide layout-terminal">
  <header class="head">
    <div class="head-rule" aria-hidden="true"></div>
    <h1><slot name="title" accepts="inline" arity="1"></slot></h1>
  </header>
  <div class="terminal-columns">
    <div class="terminal-body slot-body-wrap"><slot name="body" accepts="blocks" arity="1"></slot></div>
    <div class="bf-mount terminal-mount" data-bf="Terminal"></div>
  </div>
</section>
