name = "barefootjs-django-example"
main = "container.ts"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]

[cache]
enabled = true

[[containers]]
class_name = "DjangoContainer"
image = "./Dockerfile"
max_instances = 1
# Memory and disk are billed on the instance type's provisioned size, so pin it
# rather than inherit a platform default that could move the bill silently.
# `lite` (256 MiB / 1/16 vCPU / 2 GB) is the smallest and fits this demo.
instance_type = "lite"

[[durable_objects.bindings]]
name = "DJANGO_CONTAINER"
class_name = "DjangoContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DjangoContainer"]

# Two patterns: `/integrations/django/*` matches /integrations/django/...
# but not the bare /integrations/django, so add the no-slash variant
# explicitly.
[[routes]]
pattern = "barefootjs.dev/integrations/django"
zone_name = "barefootjs.dev"

[[routes]]
pattern = "barefootjs.dev/integrations/django/*"
zone_name = "barefootjs.dev"

[vars]
BASE_PATH = "/integrations/django"
