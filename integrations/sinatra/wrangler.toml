name = "barefootjs-sinatra-example"
main = "container.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "SinatraContainer"
image = "./Dockerfile"
max_instances = 1
# Memory and disk are billed on the instance type's provisioned size, so pin it
# rather than inherit a platform default that could move the bill silently.
# `lite` (256 MiB / 1/16 vCPU / 2 GB) is the smallest and fits this demo.
instance_type = "lite"

[[durable_objects.bindings]]
name = "SINATRA_CONTAINER"
class_name = "SinatraContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SinatraContainer"]

# Two patterns: `/integrations/sinatra/*` matches /integrations/sinatra/...
# but not the bare /integrations/sinatra, so add the no-slash variant
# explicitly.
[[routes]]
pattern = "barefootjs.dev/integrations/sinatra"
zone_name = "barefootjs.dev"

[[routes]]
pattern = "barefootjs.dev/integrations/sinatra/*"
zone_name = "barefootjs.dev"

[vars]
BASE_PATH = "/integrations/sinatra"
