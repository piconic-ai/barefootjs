# The Cloudflare Container worker probes defaultPort 8080 (container.ts);
# Spring Boot's own default server.port is already 8080, so PORT need only
# be set for local dev (see package.json's `dev`/`test:e2e` scripts, which
# set PORT=3017) -- see the Dockerfile's note on PR #2080's outage.
server.port=${PORT:8080}

app.base-path=${BASE_PATH:/integrations/spring}
app.env=${APP_ENV:production}

# Keep Spring Boot's own startup banner/logging quiet enough that curl-based
# smoke checks and Playwright's webServer readiness probe aren't drowned out.
spring.main.log-startup-info=true
logging.level.root=INFO
