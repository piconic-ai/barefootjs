name = "barefootjs-spring-example"
main = "container.ts"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]

[cache]
enabled = true

[[containers]]
class_name = "SpringContainer"
image = "./Dockerfile"
# Build from the repo root so the Gradle composite-build path pointing at
# ../../packages/adapter-pebble/java can resolve inside the image.
image_build_context = "../.."
max_instances = 1
# Memory and disk are billed on the instance type's provisioned size, so pin it
# rather than inherit a platform default that could move the bill silently.
# `lite` (256 MiB / 1/16 vCPU) is NOT enough here: it fits this demo's
# steady-state heap footprint, but a cold-starting JVM (classloading + the
# full Spring context bootstrap) needs meaningfully more memory AND CPU than
# that just to bind the port before Cloudflare's readiness check gives up --
# `lite` here produced "Failed to start container: The container is not
# listening in the TCP address ...:8080" in production (#3027) -- the same
# readiness-check-races-startup symptom reported for other slow-starting
# runtimes on Cloudflare Containers, e.g. Laravel/FrankenPHP
# (https://github.com/cloudflare/containers/issues/139), not something
# that issue documents as JVM- or memory-specific itself. `basic` (1 GiB,
# 1/4 vCPU) is the smallest tier with enough headroom for a reliable cold
# start; this is a startup-time floor, not a steady-state one, so it isn't
# the same knob a growing steady-state heap would bump.
instance_type = "basic"

[[durable_objects.bindings]]
name = "SPRING_CONTAINER"
class_name = "SpringContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpringContainer"]

# Two patterns: `/integrations/spring/*` matches /integrations/spring/... but
# not the bare /integrations/spring, so add the no-slash variant explicitly.
[[routes]]
pattern = "barefootjs.dev/integrations/spring"
zone_name = "barefootjs.dev"

[[routes]]
pattern = "barefootjs.dev/integrations/spring/*"
zone_name = "barefootjs.dev"

[vars]
BASE_PATH = "/integrations/spring"
