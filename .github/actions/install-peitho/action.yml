name: 'Install peitho (kfly8/peitho fork)'
description: >
  Builds kfly8/peitho from source and installs it to /usr/local/bin/peitho.
  Built from source, unlike setup-bun's pinned-release download, because the
  fork has no release artifacts of its own — see site/core/slides/overview/
  component/mount.ts for why a fork is used at all (fixes not yet upstreamed
  into mizzy/peitho).

inputs:
  ref:
    description: 'kfly8/peitho branch or commit to build.'
    required: false
    default: 'main'

runs:
  using: 'composite'
  steps:
    # ubuntu-latest ships rustup with a stable toolchain preinstalled (see
    # ci-rust.yml's Setup Rust step).
    - name: Setup Rust
      shell: bash
      run: rustup update stable && rustup default stable

    - name: Checkout kfly8/peitho
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: kfly8/peitho
        ref: ${{ inputs.ref }}
        path: .peitho-src

    - name: Cache peitho build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          .peitho-src/target
        key: peitho-${{ runner.os }}-${{ hashFiles('.peitho-src/Cargo.lock') }}
        restore-keys: |
          peitho-${{ runner.os }}-

    - name: Build and install peitho
      shell: bash
      run: |
        cd .peitho-src
        cargo build --release --bin peitho
        sudo install -m755 target/release/peitho /usr/local/bin/peitho
        peitho --version
