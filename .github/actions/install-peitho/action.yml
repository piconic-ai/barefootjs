name: 'Install peitho'
description: >
  Downloads a pinned mizzy/peitho release, verifies its checksum, and
  installs it to /usr/local/bin/peitho. Shared by ci-slides.yml and
  deploy.yml so both always build decks with the same binary.

inputs:
  version:
    description: 'mizzy/peitho release to install (without the leading v).'
    required: false
    # 1.34.0 is the first release that runs a layout's own <script> and
    # resolves its assets/ references (mizzy/peitho#529, #530), which the
    # overview deck's mount.js relies on.
    default: '1.34.0'
  sha256:
    description: 'SHA-256 of the x86_64-unknown-linux-gnu tarball for `version`.'
    required: false
    default: '968b7d45a54fb2bf40a0b9bdad277d01d28ff437f461dffcbaa86b9c1bad219a'

runs:
  using: 'composite'
  steps:
    - name: Download and install peitho
      shell: bash
      env:
        PEITHO_VERSION: ${{ inputs.version }}
        PEITHO_SHA256: ${{ inputs.sha256 }}
      run: |
        NAME="peitho-v${PEITHO_VERSION}-x86_64-unknown-linux-gnu"
        curl -sSL -o peitho.tar.gz "https://github.com/mizzy/peitho/releases/download/v${PEITHO_VERSION}/${NAME}.tar.gz"
        echo "${PEITHO_SHA256}  peitho.tar.gz" | sha256sum --check
        tar -xzf peitho.tar.gz
        sudo install -m755 "${NAME}/peitho" /usr/local/bin/peitho
        rm -rf peitho.tar.gz "${NAME}"
        peitho --version
