name: Benchmark

# Trigger notes — two blind spots this configuration has, both hit for real:
#
#  - `branches: [main]` means a STACKED pull request (one based on another
#    feature branch) never runs this workflow. Retargeting its base to main
#    afterwards does NOT re-trigger, so the numbers get checked only if
#    something is pushed after the retarget. Several PRs in the slot
#    unification series merged with no benchmark run at all this way.
#  - the workflow file was absent from its own `paths`, so a change to the
#    benchmark steps could not test itself. The SSR-heap step below was added
#    and merged without ever executing because of exactly that.
#
# `workflow_dispatch` exists so this can be run on demand against any ref —
# the escape hatch for both cases, and how a workflow edit gets verified.
on:
  pull_request:
    paths:
      - 'packages/client/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build packages (benchmark apps bundle from published dists)
        run: |
          bun run --filter '@barefootjs/shared' build
          bun run --filter '@barefootjs/streaming' build
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/client' build

      - name: Build benchmark apps
        run: |
          bun benchmarks/runner/build.ts
          for f in react solid barefoot; do
            bun "benchmarks/ssr/apps/$f/build.ts"
          done

      # Write the result into GITHUB_OUTPUT even when the bench itself
      # fails: `bash -e` would otherwise abort mid-heredoc, truncating the
      # multiline block ("Matching delimiter not found") and masking the
      # real error.
      - name: Run DOM benchmark (quick)
        id: bench
        run: |
          set +e
          bun benchmarks/runner/bench-dom.ts --quick --md > /tmp/bench-dom.out 2>&1
          status=$?
          {
            echo 'result<<BENCH_EOF'
            cat /tmp/bench-dom.out
            echo 'BENCH_EOF'
          } >> "$GITHUB_OUTPUT"
          cat /tmp/bench-dom.out
          exit $status

      - name: Run SSR benchmark
        id: bench_ssr
        run: |
          set +e
          bun benchmarks/ssr/bench-ssr.ts --md > /tmp/bench-ssr.out 2>&1
          status=$?
          {
            echo 'result<<BENCH_EOF'
            cat /tmp/bench-ssr.out
            echo 'BENCH_EOF'
          } >> "$GITHUB_OUTPUT"
          cat /tmp/bench-ssr.out
          exit $status

      # Post-hydration JS heap is the metric the lazy row graph
      # (spec/slot-unification.md §9) moves most — 2718KB -> ~1810KB over that
      # series — and it was measured only by hand until now. Guard it here so
      # a regression shows up on the PR that causes it, like every other
      # column in this comment.
      - name: Run SSR post-hydration heap benchmark
        id: bench_ssr_memory
        run: |
          set +e
          bun benchmarks/ssr/bench-ssr-memory.ts --md > /tmp/bench-ssr-memory.out 2>&1
          status=$?
          {
            echo 'result<<BENCH_EOF'
            cat /tmp/bench-ssr-memory.out
            echo 'BENCH_EOF'
          } >> "$GITHUB_OUTPUT"
          cat /tmp/bench-ssr-memory.out
          exit $status

      - name: Find existing benchmark comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## Benchmark Results'

      - name: Post benchmark results
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Benchmark Results

            > Quick mode (reduced iterations) on shared CI hardware — treat as a
            > smoke check for regressions, not as publishable numbers. Run the
            > full suite locally per `benchmarks/README.md` for real comparisons.

            ### DOM update suite

            ${{ steps.bench.outputs.result }}

            ### SSR + hydration

            ${{ steps.bench_ssr.outputs.result }}

            ### SSR post-hydration JS heap

            > Absolute heap after hydration with forced GC — not comparable to
            > the DOM suite's `memory` row, which is a heap DELTA around a
            > client-side create of 1,000 rows. This isolates each framework's
            > per-row hydration bookkeeping for the same server-rendered DOM.

            ${{ steps.bench_ssr_memory.outputs.result }}

            [Job log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · `${{ github.event.pull_request.head.sha }}`
