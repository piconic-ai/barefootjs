name: Deploy Sites

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'site/**'
      - 'ui/**'
      - 'docs/core/**'
      - 'integrations/**'
      - '.github/workflows/deploy.yml'

  # Allow manual trigger with site selection
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to deploy (leave empty to deploy all)'
        required: false
        type: choice
        options:
          - all
          - core
          - ui
          - integrations
          - integrations-hono
          - integrations-ssg
          - integrations-h3
          - integrations-elysia
          - integrations-echo
          - integrations-gin
          - integrations-chi
          - integrations-nethttp
          - integrations-mojolicious
          - integrations-xslate
          - integrations-flask
          - integrations-fastapi
          - integrations-sinatra
          - integrations-rails
          - integrations-axum
          - integrations-php
          - integrations-django
          - integrations-blade
          - integrations-laravel
          - integrations-spring

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-core:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.site == 'all' || github.event.inputs.site == 'core')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Wrangler 4.x shells out to Node and requires v22+. The runner's
      # default Node 20 makes `bunx wrangler deploy` exit immediately.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build
          bun run --filter '@barefootjs/hono' build

      # Slide decks under site/core/slides/<slug>/ are peitho decks; their
      # output (public/slides/<slug>/) is not committed, it is built as part
      # of the "Build site" step below (`bun run build` runs `slides:build
      # --all` first, see site/core/package.json).
      - name: Install peitho
        uses: ./.github/actions/install-peitho

      - name: Build site (includes slide decks)
        run: cd site/core && bun run build

      - name: Deploy to Cloudflare Workers
        run: cd site/core && bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-ui:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.site == 'all' || github.event.inputs.site == 'ui')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Wrangler 4.x shells out to Node and requires v22+. The runner's
      # default Node 20 makes `bunx wrangler deploy` exit immediately.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build
          bun run --filter '@barefootjs/hono' build
          bun run --filter '@barefootjs/form' build
          bun run --filter '@barefootjs/chart' build
          bun run --filter '@barefootjs/xyflow' build

      - name: Extract component metadata
        run: bun run meta:extract

      - name: Build site
        run: cd site/ui && bun run build:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Static Worker first: it serves /static/* and /r/* (assets-only,
      # free), and the HTML Worker deployed next references its new chunks.
      # See site/ui/wrangler.static.toml.
      - name: Deploy static assets Worker to Cloudflare Workers
        run: cd site/ui && bunx wrangler deploy -c wrangler.static.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: cd site/ui && bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}


  # Which integrations to deploy: every integrations/<name>/ with a
  # wrangler.toml, since that is the file `wrangler deploy` reads. Derived,
  # never a hand-written list, so a new integration is deployed without
  # editing this file (the dispatch `site` choice above still has to list it
  # to deploy it on its own).
  plan-integrations:
    if: >-
      github.event_name == 'push'
      || github.event.inputs.site == 'all'
      || startsWith(github.event.inputs.site, 'integrations')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List deploy targets
        id: plan
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          set -euo pipefail
          # `adapters` is the integration's @barefootjs/* dependencies minus
          # the toolchain every leg builds anyway: the adapter package it
          # renders with (none for ssg, which only uses CSRAdapter).
          targets=$(
            for toml in integrations/*/wrangler.toml; do
              dir=$(dirname "$toml")
              jq -c --arg name "$(basename "$dir")" '{
                name: $name,
                adapters: ([(.dependencies // {}), (.devDependencies // {})] | add | keys
                  | map(select(startswith("@barefootjs/")))
                  - ["@barefootjs/client", "@barefootjs/jsx", "@barefootjs/router", "@barefootjs/shared", "@barefootjs/vite"]
                  | join(" "))
              }' "$dir/package.json"
            done | jq -sc .
          )
          case "$SITE" in
            integrations-*)
              name=${SITE#integrations-}
              targets=$(jq -c --arg name "$name" 'map(select(.name == $name))' <<<"$targets")
              if [ "$targets" = "[]" ]; then
                echo "::error::integrations/$name/wrangler.toml does not exist"
                exit 1
              fi
              ;;
          esac
          echo "$targets" | jq .
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  deploy-integrations:
    needs: plan-integrations
    name: deploy-integrations-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    strategy:
      # Each deploy is independent: one integration failing must not cancel
      # the others.
      fail-fast: false
      # Twenty short deploys (0.4-2.3 min each). As separate jobs they all
      # queued at once and took the account's whole concurrent-job pool (20
      # on the Free plan) on every merge. Four at a time finishes in about the
      # same wall-clock time as the pool allowed anyway.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan-integrations.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Wrangler 4.x shells out to Node and requires v22+. The runner's
      # default Node 20 makes `bunx wrangler deploy` exit immediately.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build packages
        env:
          ADAPTERS: ${{ matrix.adapters }}
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build
          for pkg in $ADAPTERS; do
            bun run --filter "$pkg" build
          done

      - name: Build integration
        run: cd "integrations/${{ matrix.name }}" && bun run build

      # For a Container integration, wrangler deploy also builds the image
      # from the integration's Dockerfile, which needs Docker on the runner;
      # ubuntu-latest ships with a running Docker daemon. Any compile step the
      # image needs (e.g. spring's `gradle bootJar`) runs inside the image
      # build, so only the Bun/Vite build above has to happen first: the
      # Dockerfiles COPY its output rather than rebuilding it.
      - name: Deploy to Cloudflare Workers
        run: cd "integrations/${{ matrix.name }}" && bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
