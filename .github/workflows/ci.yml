name: CI — Core

on:
  push:
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/jsx/**'
      - 'packages/form/**'
      - 'packages/test/**'
      - 'packages/chart/**'
      - 'packages/xyflow/**'
      - 'packages/adapter-tests/**'
      - 'packages/router/**'
      # site/ui is the Hono adapter's end-to-end target, so Hono changes must
      # re-run this workflow's e2e-site-ui job (ci-hono.yml no longer duplicates it).
      - 'packages/adapter-hono/**'
      # The CLI compiles site/ui, so cli changes can break the e2e-site-ui
      # job without touching any other gated path.
      - 'packages/cli/**'
      - 'ui/**'
      - 'site/ui/**'
      - 'site/core/**'
      - 'site/shared/**'
      - '.github/workflows/ci.yml'
      # Central divergence validation in adapter-tests re-checks every
      # adapter's declarations, so it must re-run when any adapter edits its.
      - 'packages/**/vector-divergences.json'
      # The release scripts' unit tests (scripts/lib/__tests__) run in the
      # `rest` group below; the sharder is what the jsx/adapter-tests groups run.
      - 'scripts/**'
      # integrations/shared/lib's unit tests (the Workers Cache policy and the
      # Container image init guard, which reads every integration's
      # wrangler.toml + Dockerfile) also run in the `rest` group below.
      - 'integrations/shared/lib/**'
      - 'integrations/*/Dockerfile'
      - 'integrations/*/wrangler.toml'
  pull_request:
    paths:
      - 'packages/client/**'
      - 'packages/jsx/**'
      - 'packages/form/**'
      - 'packages/test/**'
      - 'packages/chart/**'
      - 'packages/xyflow/**'
      - 'packages/adapter-tests/**'
      - 'packages/router/**'
      # site/ui is the Hono adapter's end-to-end target, so Hono changes must
      # re-run this workflow's e2e-site-ui job (ci-hono.yml no longer duplicates it).
      - 'packages/adapter-hono/**'
      # The CLI compiles site/ui, so cli changes can break the e2e-site-ui
      # job without touching any other gated path.
      - 'packages/cli/**'
      - 'ui/**'
      - 'site/ui/**'
      - 'site/core/**'
      - 'site/shared/**'
      - '.github/workflows/ci.yml'
      # Central divergence validation in adapter-tests re-checks every
      # adapter's declarations, so it must re-run when any adapter edits its.
      - 'packages/**/vector-divergences.json'
      # The release scripts' unit tests (scripts/lib/__tests__) run in the
      # `rest` group below; the sharder is what the jsx/adapter-tests groups run.
      - 'scripts/**'
      # integrations/shared/lib's unit tests (the Workers Cache policy and the
      # Container image init guard, which reads every integration's
      # wrangler.toml + Dockerfile) also run in the `rest` group below.
      - 'integrations/shared/lib/**'
      - 'integrations/*/Dockerfile'
      - 'integrations/*/wrangler.toml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: test (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # jsx-1/jsx-2 split packages/jsx's test files into two
          # size-balanced shards (see scripts/ci/shard-test-files.ts) since
          # jsx dominates unit test wall time relative to client/test/router.
          - group: jsx-1
            run: bun test $(bun scripts/ci/shard-test-files.ts packages/jsx 1 2)
          - group: jsx-2
            run: bun test $(bun scripts/ci/shard-test-files.ts packages/jsx 2 2)
          # adapter-tests-1/2/3 split packages/adapter-tests the same way.
          # It used to run inside `rest`, where it alone accounted for
          # ~9 of `rest`'s ~10 minutes (measured via the Actions API across
          # several runs) — every other package in `rest` finishes in
          # under a minute combined — making `rest` the workflow's critical
          # path and the wall-clock floor for every PR. Plain file size is
          # a weaker proxy here than for jsx: a handful of small files
          # (e.g. csr-conformance.test.ts, 2.2KB) loop over the
          # ~360-fixture corpus once or more per file, so their wall time
          # is far larger than byte size implies — see the manual
          # WEIGHT_OVERRIDES entries in shard-test-files.ts that correct
          # for those specific files.
          - group: adapter-tests-1
            run: bun test $(bun scripts/ci/shard-test-files.ts packages/adapter-tests 1 3)
          - group: adapter-tests-2
            run: bun test $(bun scripts/ci/shard-test-files.ts packages/adapter-tests 2 3)
          - group: adapter-tests-3
            run: bun test $(bun scripts/ci/shard-test-files.ts packages/adapter-tests 3 3)
          - group: rest
            # integrations/shared/lib runs in its own process: packages/client's
            # tests register happy-dom's globals, whose Headers drop Set-Cookie /
            # Cookie as a browser does, so the Workers Cache policy tests would
            # see cookie-free responses if they shared the process.
            run: bun test packages/client packages/shared packages/test packages/router scripts/lib && bun test integrations/shared/lib

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build

      - name: Run unit tests
        run: ${{ matrix.run }}

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build

      - name: Run UI component IR tests
        run: bun test ui/components/

  e2e-site-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build
          bun run --filter '@barefootjs/hono' build

      - name: Build site/core
        run: cd site/core && bun run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Run site/core E2E tests
        run: cd site/core && bunx playwright test

      - name: Upload Playwright report (site/core)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-site-core
          path: site/core/playwright-report/

  fixture-hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      # `test:fixture-hydrate` names its two spec files explicitly
      # (fixture-hydrate.playwright.ts + oracle.playwright.ts, #2481) so
      # this PR-triggered job does NOT also pick up mutation.playwright.ts
      # (#2481 step 2) — that sweep needs a `mutation-generate.ts` run
      # first and is nightly-only budget-wise; see
      # `.github/workflows/mutation-sweep.yml`.
      - name: Run fixture-hydrate + oracle E2E tests
        run: bun run --filter '@barefootjs/adapter-tests' test:fixture-hydrate

      # `playwright.config.ts` uses the `list` reporter (not `html`), so
      # there's no `playwright-report/` to upload here — `test-results/`
      # is where `trace: 'retain-on-failure'` actually writes a failure's
      # trace zip.
      - name: Upload Playwright traces (fixture-hydrate)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces-fixture-hydrate
          path: packages/adapter-tests/test-results/
          retention-days: 30

  e2e-site-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build
          bun run --filter '@barefootjs/form' build
          bun run --filter '@barefootjs/chart' build
          bun run --filter '@barefootjs/xyflow' build
          bun run --filter '@barefootjs/hono' build

      - name: Build site/ui
        run: cd site/ui && bun run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Key on package.json (committed, deterministic) — not bun.lock
          # which is gitignored and re-solved per run.
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Run site/ui E2E tests (shard ${{ matrix.shard }}/4)
        run: cd site/ui && bunx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report (site/ui)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-site-ui-shard-${{ matrix.shard }}
          path: site/ui/playwright-report/
          retention-days: 30
