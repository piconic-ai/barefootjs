name: CI — Pebble (Java) Adapter

on:
  push:
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'packages/jsx/**'
      - 'packages/adapter-pebble/**'
      - 'packages/adapter-tests/**'
      - 'integrations/spring/**'
      - '.github/workflows/ci-pebble.yml'
  pull_request:
    paths:
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'packages/jsx/**'
      - 'packages/adapter-pebble/**'
      - 'packages/adapter-tests/**'
      - 'integrations/spring/**'
      - '.github/workflows/ci-pebble.yml'
  # Nightly full-matrix data-point conformance (#2278): PR/push runs the
  # fast `pr` tier (sampled generated points); the scheduled run exercises
  # every generated point (BF_DATA_POINT_TIER below). `workflow_dispatch`
  # allows a manual full run. `runDataPointConformance` is invoked
  # unconditionally from `runAdapterConformanceTests` (see
  # `pebble-conformance.test.ts`), the same shared harness every other
  # adapter workflow schedules this way — Pebble is no different even
  # though nothing under packages/adapter-pebble itself references the env
  # var directly.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pebble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The adapter's unit + conformance suite alone runs ~11-14 min on a
    # shared runner, so a 15-minute cap cancels passing runs under load.
    timeout-minutes: 30
    # PR/push run the fast sampled data-point tier; the nightly `schedule`
    # (and a manual `workflow_dispatch`) run the full generated-point matrix
    # (#2278).
    env:
      BF_DATA_POINT_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            packages/adapter-pebble/java/build
            integrations/spring/build
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/adapter-pebble/java/**/*.gradle.kts', 'integrations/spring/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # No committed Gradle wrapper for this package (see
      # packages/adapter-pebble/README.md's "Gradle project layout" note) —
      # `gradle` is provisioned directly on PATH, matching how
      # `test-render.ts`'s `ensureFatJarBuilt` invokes it.
      - name: Run Java runtime unit tests
        # Includes the golden-vector conformance harness (see
        # spec/template-helpers.md) plus RenderChildTest and
        # SetBlockExtensionTest.
        run: cd packages/adapter-pebble/java && gradle test

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build
          bun run --filter '@barefootjs/pebble' build

      # The conformance suite compiles the shared IR fixtures, then renders
      # the emitted .peb templates through the Pebble Java runtime's fat
      # jar — built on demand by the harness's own memoized
      # `ensureFatJarBuilt` (a `gradle shadowJar` invocation), so no
      # separate shadowJar step is needed here.
      - name: Run unit tests
        id: unit
        run: bun test --max-concurrency=8 packages/adapter-pebble

      # E2E runs in this job, after the unit tests, instead of in its own
      # `needs: test` job: a separate job queued a second time for a runner
      # and repeated checkout + install + build for ~1 min of Playwright
      # (#3155). A unit-test failure still skips it, as `needs:` did. The
      # accepted cost: re-running a flaky E2E step re-runs the whole job,
      # unit suite included, instead of a ~1 min E2E job.
      - name: Build integrations/spring
        run: cd integrations/spring && bun run build

      # No committed Gradle wrapper for either project (see
      # packages/adapter-pebble/README.md's "Gradle project layout" note) —
      # `gradle` is provisioned directly on PATH. `compileJava` here also
      # transitively builds the composite-build dependency on
      # packages/adapter-pebble/java (see settings.gradle.kts), so a broken
      # runtime fails this step loudly instead of surfacing later as a
      # webServer boot failure inside the Playwright run.
      - name: Build Spring Boot application
        run: cd integrations/spring && gradle compileJava --no-daemon

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Key on package.json (committed, deterministic) — not bun.lock
          # which is gitignored and re-solved per run.
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Run integrations/spring E2E tests
        id: e2e_spring
        run: cd integrations/spring && bun run test:e2e

      - name: Upload Playwright report (integrations/spring)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.e2e_spring.outcome != 'skipped' }}
        with:
          name: playwright-report-integrations-spring
          path: integrations/spring/playwright-report/
          retention-days: 30
