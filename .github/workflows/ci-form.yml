name: CI — Form

on:
  push:
    branches: [main]
    paths:
      - 'packages/form/**'
      - 'packages/client/**'
      - '.github/workflows/ci-form.yml'
  pull_request:
    # Heavy set: main-based PRs only, default activity types. A stacked PR
    # (base != main) never runs this; ci-heavy-gate.yml goes red on a PR
    # retargeted onto main until a push runs it. See AGENTS.md, "CI on
    # stacked PRs".
    branches: [main]
    paths:
      - 'packages/form/**'
      - 'packages/client/**'
      - '.github/workflows/ci-form.yml'

permissions:
  contents: read

concurrency:
  group: ci-form-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build dependencies
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build

      - name: Type check
        run: cd packages/form && npx tsc --noEmit

      - name: Run tests
        run: bun test --cwd packages/form

      - name: Build
        run: cd packages/form && bun run build
