name: Update API Reference

# Verify-only, same shape as update-adapter-docs.yml: the API reference
# (docs/core/advanced/api-reference.md) is generated by
# scripts/generate-api-reference.ts from the `@since` / `@stability` /
# `@example` JSDoc tags on the public exports of the documented surfaces.
# Without this job an export could land untagged, a beta promotion could land
# with no usage example, the page could drift from the tags, or a link into it
# (from the README's stability table, say) could point at a heading that no
# longer exists — and nothing would notice.
#
# No `branches` filter: a stacked PR's head can drift the same as a
# main-based one (see CLAUDE.md's "When main Breaks" section).

on:
  pull_request:
    paths:
      - 'packages/client/src/**'
      - 'packages/shared/src/**'
      - 'packages/vite/src/**'
      - 'packages/jsx/src/directives.ts'
      - 'packages/adapter-*/src/vite.ts'
      - 'packages/adapter-*/src/adapter/*-adapter.ts'
      - 'scripts/generate-api-reference.ts'
      - 'site/core/lib/heading-slug.ts'
      - 'docs/core/advanced/api-reference.md'
      # The generator also checks that these files' links into the reference
      # resolve to headings it actually emits.
      - 'README.md'
      - 'docs/core/advanced/vite-plugin.md'
      - '.github/workflows/update-api-reference.yml'

permissions:
  contents: read

concurrency:
  group: update-api-reference-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-api-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Check the API reference is up to date and every export is tagged
        run: bun run scripts/generate-api-reference.ts --check
