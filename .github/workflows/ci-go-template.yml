name: CI — Go Template Adapter

on:
  push:
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/jsx/**'
      - 'packages/adapter-go-template/**'
      - 'packages/preview/**'
      - 'packages/adapter-tests/**'
      - 'integrations/echo/**'
      - 'integrations/shared/query-todo/**'
      - 'integrations/shared/e2e/**'
      - '.github/workflows/ci-go-template.yml'
  pull_request:
    # Heavy set: main-based PRs only, default activity types. A stacked PR
    # (base != main) never runs this; ci-heavy-gate.yml goes red on a PR
    # retargeted onto main until a push runs it. See AGENTS.md, "CI on
    # stacked PRs".
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/jsx/**'
      - 'packages/adapter-go-template/**'
      - 'packages/preview/**'
      - 'packages/adapter-tests/**'
      - 'integrations/echo/**'
      - 'integrations/shared/query-todo/**'
      - 'integrations/shared/e2e/**'
      - '.github/workflows/ci-go-template.yml'
  # Nightly full-matrix data-point conformance (#2278): PR/push runs the
  # fast `pr` tier (sampled generated points); the scheduled run exercises
  # every generated point (BF_DATA_POINT_TIER below). `workflow_dispatch`
  # allows a manual full run.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name keeps the nightly `schedule` (and manual) runs out of the
  # `push` group: on `main` both have the same ref, so a merge would cancel
  # the full-tier run.
  group: ci-go-template-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.pull_request.stack == null || github.event.pull_request.stack.position <= 1)) || (github.event.pull_request.stack.base.ref == 'main' && github.event.pull_request.stack.position >= github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    # The unit-test step alone ran 31.6 min and the whole job 33.5 min
    # against a 35-minute cap, and it grows with the fixture corpus (#3627).
    timeout-minutes: 50
    # PR/push run the fast sampled data-point tier; the nightly `schedule`
    # (and a manual `workflow_dispatch`) run the full generated-point matrix
    # (#2278).
    env:
      BF_DATA_POINT_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # integrations/echo's go.mod requires 1.26 (labstack/echo v4.16.1);
          # the runtime and the other integrations still declare 1.25.6.
          go-version: '1.26'
          # Its built-in cache keys on a root go.sum, which does not exist (the
          # go.sum files are under integrations/*/), so it never saves. Keep it
          # off rather than fix the key: no cross-run cache that could be
          # poisoned (see .github/actions/setup-bun).
          cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build
          bun run --filter '@barefootjs/go-template' build

      - name: Pre-warm Go build cache
        run: cd packages/adapter-go-template/runtime && GOTOOLCHAIN=local go build ./...

      - name: Run Go runtime unit tests
        # Includes the golden-vector conformance harness (vectors_test.go,
        # see spec/template-helpers.md).
        run: cd packages/adapter-go-template/runtime && GOTOOLCHAIN=local go test ./...

      - name: Run unit tests
        id: unit
        run: bun test --max-concurrency=8 packages/adapter-go-template

      # E2E runs in this job, after the unit tests, instead of in its own
      # `needs: test` job: a separate job queued a second time for a runner
      # and repeated checkout + install + build for ~1 min of Playwright
      # (#3155). A unit-test failure still skips it, as `needs:` did. The
      # accepted cost: re-running a flaky E2E step re-runs the whole job,
      # unit suite included, instead of a ~1 min E2E job.
      - name: Build integrations/echo
        run: cd integrations/echo && bun run build

      # #2327: generated components.go must not drift from the compiler.
      # `bun run build` regenerates into the working tree and the E2E below
      # runs against that fresh output, so a stale COMMITTED file used to
      # pass CI silently (how the #2267 interface{} flip went unregenerated
      # for four integrations). chi/gin/nethttp are built here only to feed
      # the drift check — echo carries the E2E coverage. Same gate pattern
      # as ci-compat.yml's lockfile drift check.
      - name: Build remaining Go integrations (drift-check inputs)
        run: |
          (cd integrations/chi && bun run build)
          (cd integrations/gin && bun run build)
          (cd integrations/nethttp && bun run build)

      - name: Check generated components.go for drift
        run: |
          if ! git diff --exit-code -- integrations/chi/components.go integrations/echo/components.go integrations/gin/components.go integrations/nethttp/components.go; then
            echo "::error::integrations/*/components.go are out of date. Run 'bun run build' in each Go integration and commit the result."
            exit 1
          fi

      - name: Download Go dependencies
        run: cd integrations/echo && go mod download

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Key on package.json (committed, deterministic) — not bun.lock
          # which is gitignored and re-solved per run.
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Run integrations/echo E2E tests
        id: e2e_echo
        run: cd integrations/echo && bun run test:e2e

      - name: Upload Playwright report (integrations/echo)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.e2e_echo.outcome != 'skipped' }}
        with:
          name: playwright-report-integrations-echo
          path: integrations/echo/playwright-report/
          retention-days: 30
