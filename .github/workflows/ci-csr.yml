name: CI — CSR Integration

on:
  push:
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/jsx/**'
      - 'packages/vite/**'
      - 'integrations/csr/**'
      - 'integrations/shared/**'
      - '.github/workflows/ci-csr.yml'
  pull_request:
    # Heavy set: main-based PRs only, default activity types. A stacked PR
    # (base != main) never runs this; ci-heavy-gate.yml goes red on a PR
    # retargeted onto main until a push runs it. See CLAUDE.md, "CI on
    # stacked PRs".
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/jsx/**'
      - 'packages/vite/**'
      - 'integrations/csr/**'
      - 'integrations/shared/**'
      - '.github/workflows/ci-csr.yml'

permissions:
  contents: read

concurrency:
  group: ci-csr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-csr:
    name: e2e-csr (vite ${{ matrix.vite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One leg per Vite major in `@barefootjs/vite`'s (and every adapter's
    # `/vite` builder's) `vite` peer range. The plugin only imports Vite
    # types, so the Vite that actually runs is the app's own — here
    # integrations/csr's. Keep this list and the peer range in step: a major
    # is added to the range only together with its leg here.
    strategy:
      fail-fast: false
      matrix:
        vite: ['6', '7', '8']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      # The workspace pins integrations/csr to the range floor (`^6.0.0`);
      # swap in this leg's major, then fail loudly if resolution landed
      # anywhere else, so a leg can never silently test the wrong Vite.
      - name: Install Vite ${{ matrix.vite }}
        working-directory: integrations/csr
        run: |
          bun add --dev "vite@^${{ matrix.vite }}"
          resolved=$(bun -e "console.log(require('vite/package.json').version)")
          echo "Resolved vite@$resolved"
          case "$resolved" in
            "${{ matrix.vite }}".*) ;;
            *) echo "::error::expected vite ${{ matrix.vite }}.x, got $resolved"; exit 1 ;;
          esac

      # CSR has no backend adapter: `vite.config.ts` drives `barefoot()` with
      # `CSRAdapter` from @barefootjs/client itself, and the pages render
      # entirely in the browser. So the package set is jsx + vite + client,
      # with no adapter-* build — this is the one integration whose whole
      # pipeline is those three.
      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Run integrations/csr E2E tests
        run: cd integrations/csr && bun run test:e2e

      - name: Upload Playwright report (integrations/csr)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integrations-csr-vite${{ matrix.vite }}
          path: integrations/csr/playwright-report/
          retention-days: 30
