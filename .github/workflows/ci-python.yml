name: CI — Python (Jinja2) Adapter

on:
  push:
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'packages/jsx/**'
      - 'packages/adapter-jinja/**'
      - 'packages/adapter-tests/**'
      - 'integrations/flask/**'
      - 'integrations/fastapi/**'
      - 'integrations/django/**'
      - '.github/workflows/ci-python.yml'
  pull_request:
    paths:
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'packages/jsx/**'
      - 'packages/adapter-jinja/**'
      - 'packages/adapter-tests/**'
      - 'integrations/flask/**'
      - 'integrations/fastapi/**'
      - 'integrations/django/**'
      - '.github/workflows/ci-python.yml'
  # Nightly full-matrix data-point conformance (#2278): PR/push runs the
  # fast `pr` tier (sampled generated points); the scheduled run exercises
  # every generated point (BF_DATA_POINT_TIER below). `workflow_dispatch`
  # allows a manual full run.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # PR/push run the fast sampled data-point tier; the nightly `schedule`
    # (and a manual `workflow_dispatch`) run the full generated-point matrix
    # (#2278).
    env:
      BF_DATA_POINT_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install jinja2
        run: pip install jinja2

      - name: Run Python runtime unit tests
        # Includes the golden-vector conformance harness (test_helper_vectors.py,
        # test_eval_vectors.py; see spec/template-helpers.md) plus the live
        # Jinja render test (test_render.py).
        run: python3 -m unittest discover -s packages/adapter-jinja/python/tests -t packages/adapter-jinja/python

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/vite' build
          bun run --filter '@barefootjs/client' build
          bun run --filter '@barefootjs/jinja' build

      # The conformance suite compiles the shared IR fixtures, then renders
      # the emitted Jinja templates through real Jinja2 + the Python
      # BarefootJS runtime (it skips gracefully when `jinja2` is absent —
      # installed above so it runs for real).
      - name: Run unit tests (incl. live Jinja2 render + conformance)
        id: unit
        run: bun test --max-concurrency=8 packages/adapter-jinja

      # E2E runs in this job, after the unit tests, instead of in its own
      # `needs: test` job: a separate job queued a second time for a runner
      # and repeated checkout + install + build for ~1 min of Playwright
      # (#3155). A unit-test failure still skips it, as `needs:` did. The
      # accepted cost: re-running a flaky E2E step re-runs the whole job,
      # unit suite included, instead of a ~1 min E2E job.
      # Each integration's build/run is gated on the unit step, not on the
      # steps before it, so one integration's failure doesn't skip the next
      # one's E2E (they used to be independent sibling jobs).
      - name: Install Python dependencies (E2E integrations)
        run: pip install -r integrations/flask/requirements.txt -r integrations/fastapi/requirements.txt -r integrations/django/requirements.txt

      - name: Build integrations/flask
        run: cd integrations/flask && bun run build

      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Key on package.json (committed, deterministic) — not bun.lock
          # which is gitignored and re-solved per run.
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright browser binaries
        if: ${{ !cancelled() && steps.unit.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: bunx playwright install chromium

      - name: Run integrations/flask E2E tests
        id: e2e_flask
        run: cd integrations/flask && bun run test:e2e

      - name: Upload Playwright report (integrations/flask)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.e2e_flask.outcome != 'skipped' }}
        with:
          name: playwright-report-integrations-flask
          path: integrations/flask/playwright-report/
          retention-days: 30

      - name: Build integrations/fastapi
        id: build_fastapi
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: cd integrations/fastapi && bun run build

      - name: Run integrations/fastapi E2E tests
        id: e2e_fastapi
        if: ${{ !cancelled() && steps.build_fastapi.outcome == 'success' }}
        run: cd integrations/fastapi && bun run test:e2e

      - name: Upload Playwright report (integrations/fastapi)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.e2e_fastapi.outcome != 'skipped' }}
        with:
          name: playwright-report-integrations-fastapi
          path: integrations/fastapi/playwright-report/
          retention-days: 30

      - name: Build integrations/django
        id: build_django
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: cd integrations/django && bun run build

      - name: Run integrations/django E2E tests
        id: e2e_django
        if: ${{ !cancelled() && steps.build_django.outcome == 'success' }}
        run: cd integrations/django && bun run test:e2e

      - name: Upload Playwright report (integrations/django)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.e2e_django.outcome != 'skipped' }}
        with:
          name: playwright-report-integrations-django
          path: integrations/django/playwright-report/
          retention-days: 30
