name: CI — ERB Adapter

on:
  push:
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'packages/jsx/**'
      - 'packages/adapter-erb/**'
      - 'packages/adapter-tests/**'
      - '.github/workflows/ci-erb.yml'
  pull_request:
    paths:
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'packages/jsx/**'
      - 'packages/adapter-erb/**'
      - 'packages/adapter-tests/**'
      - '.github/workflows/ci-erb.yml'
  # Nightly full-matrix data-point conformance (#2278): PR/push runs the
  # fast `pr` tier (sampled generated points); the scheduled run exercises
  # every generated point (BF_DATA_POINT_TIER below). `workflow_dispatch`
  # allows a manual full run.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-erb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR/push run the fast sampled data-point tier; the nightly `schedule`
    # (and a manual `workflow_dispatch`) run the full generated-point matrix
    # (#2278).
    env:
      BF_DATA_POINT_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run --filter '@barefootjs/jsx' build
          bun run --filter '@barefootjs/client' build
          bun run --filter '@barefootjs/erb' build

      # Dependencies come from barefoot_js.gemspec via the Gemfile, so adding
      # a gem needs no change here or in release.yml. Bundler installs into
      # the default gem home, which keeps them reachable from the bare `ruby`
      # the conformance suite below spawns.
      - name: Install gem dependencies
        working-directory: packages/adapter-erb
        run: bundle install

      - name: Run Ruby minitest suite
        working-directory: packages/adapter-erb
        run: |
          for f in test/*_test.rb; do
            bundle exec ruby -Ilib -Itest "$f" || exit 1
          done

      # The bun conformance suite compiles fixtures to ERB and renders them
      # through the real Ruby runtime installed above (skips gracefully when
      # `ruby` is absent from PATH — present here, so it runs for real).
      - name: Run unit tests (incl. live Ruby render)
        run: bun test packages/adapter-erb
