name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea — rough sketches are welcome. 🙏

        **Nothing below is required.** A one-liner is fine; if we need more context
        we'll simply ask in the comments.

        > **Note:** We don't accept external pull requests due to supply-chain and AI-slop concerns.
        > That said, design discussions in issues are very welcome — and your contributions here
        > will be credited as `Co-authored-by` in the implementing commit.
        >
        > Happy hacking!

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like BarefootJS to do?
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: What it would solve (if handy)
      description: The use case or itch behind it — a code sketch of how you'd want to write it is especially helpful.
    validations:
      required: false
